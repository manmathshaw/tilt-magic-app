<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tilt Magic Peek - Locked</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    #perm-btn, #reset-btn {
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      color: #121212;
      background-color: #ffffff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    #reset-btn {
      background-color: #333333;
      color: #ffffff;
      display: none; /* Hidden until locked */
    }

    .reveal-card {
      font-size: 3rem;
      font-weight: bold;
      padding: 20px;
      border-radius: 12px;
      background: #1e1e1e;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      min-width: 200px;
    }

    .status-badge {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #888;
    }

    .debug-info {
      position: absolute;
      bottom: 20px;
      font-size: 0.85rem;
      color: #777;
    }
  </style>
</head>
<body>

  <button id="perm-btn" onclick="requestOrientationPermission()">Enable Tilt Sensors</button>

  <div class="reveal-card" id="display-content">
    Neutral (Waiting)
  </div>

  <div class="status-badge" id="status-badge">
    Status: Listening for first tilt...
  </div>

  <button id="reset-btn" onclick="resetLock()">Reset for Next Trick</button>

  <div class="debug-info" id="debug">
    Gamma: 0 | Beta: 0
  </div>

  <script>
    const displayEl = document.getElementById('display-content');
    const debugEl = document.getElementById('debug');
    const statusEl = document.getElementById('status-badge');
    const resetBtn = document.getElementById('reset-btn');

    // State lock flag
    let isLocked = false;

    function requestOrientationPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
              document.getElementById('perm-btn').style.display = 'none';
            } else {
              alert('Permission denied.');
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        document.getElementById('perm-btn').style.display = 'none';
      }
    }

    function handleOrientation(event) {
      const gamma = Math.round(event.gamma || 0);
      const beta = Math.round(event.beta || 0);

      debugEl.innerText = `Gamma (L/R): ${gamma}° | Beta (F/B): ${beta}°`;

      // IF ALREADY LOCKED, IGNORE ALL FUTURE TILT MOVEMENTS
      if (isLocked) return;

      // Detect first valid tilt movement
      if (gamma < -25) {
        lockSelection("Ace of Spades", "#d32f2f");
      } else if (gamma > 25) {
        lockSelection("King of Hearts", "#c2185b");
      } else if (beta > 50) {
        lockSelection("Queen of Diamonds", "#7b1fa2");
      } else if (beta < -20) {
        lockSelection("Jack of Clubs", "#1976d2");
      }
    }

    function lockSelection(cardName, color) {
      isLocked = true; // Set lock flag to true
      displayEl.innerText = cardName;
      displayEl.style.backgroundColor = color;
      statusEl.innerText = "Status: LOCKED (Static Output)";
      statusEl.style.color = "#4caf50";
      resetBtn.style.display = "inline-block"; // Show secret reset button
    }

    function resetLock() {
      isLocked = false;
      displayEl.innerText = "Neutral (Waiting)";
      displayEl.style.backgroundColor = "#1e1e1e";
      statusEl.innerText = "Status: Listening for first tilt...";
      statusEl.style.color = "#888";
      resetBtn.style.display = "none";
    }
  </script>
</body>
</html>
