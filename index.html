<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tilt-Lock: Quad Bicycle Peek</title>
  <style>
    /* 1. Core Structure */
    body {
      margin: 0; padding: 0;
      background-color: #121212; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100vh; text-align: center;
      overflow: hidden; /* Prevent scrolling during tilts */
    }

    /* 2. UI Elements (Setup & Reset) */
    #setup-ui {
      display: flex; flex-direction: column; align-items: center; gap: 15px;
    }
    
    #perm-btn, #reset-btn {
      padding: 16px 28px; font-size: 1.1rem; font-weight: 700;
      color: #121212; background-color: #ffffff;
      border: none; border-radius: 12px;
      cursor: pointer;
    }

    #reset-btn {
      background-color: #333333; color: #aaaaaa;
      position: absolute; bottom: 60px;
      display: none; /* Hidden until locked */
    }

    /* 3. Bicycle-Inspired Card CSS */
    .card {
      width: 250px; height: 350px; /* Classic aspect ratio */
      background-color: #ffffff; /* Bicycle White */
      color: #000000; /* Default color (Spades/Clubs) */
      border-radius: 14px; /* Professional corner radius */
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      position: relative; /* Context for children */
      display: none; /* Hidden until a tilt is locked */
      box-sizing: border-box;
      padding: 20px;
      border: 1px solid #dcdcdc; /* Subtle border classic for card paper */
    }

    /* Define Red for Hearts/Diamonds */
    .card.red-suit { color: #d32f2f; }

    /* The Large Center Pips */
    .card-pip-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 140px; /* Large center suit icon */
      line-height: 1;
    }

    /* The Corners (Rank + Suit) */
    .corner {
      position: absolute;
      display: flex; flex-direction: column; align-items: center;
      font-weight: bold; line-height: 1.1;
    }
    .corner-rank { font-size: 40px; }
    .corner-suit { font-size: 28px; }

    /* Top Left Corner */
    .corner.top-left { top: 15px; left: 15px; }
    
    /* Bottom Right Corner (Bicycle uses symmetrical reversed layout) */
    .corner.bottom-right {
      bottom: 15px; right: 15px;
      transform: rotate(180deg);
    }

    /* Instructions shown to spectator */
    #spectator-instruction {
      font-size: 1.2rem; color: #888;
      max-width: 80%;
      margin-top: 20px;
    }

    /* 4. Debug Data */
    .debug-info {
      position: absolute; bottom: 15px;
      font-size: 0.8rem; color: #555;
    }
  </style>
</head>
<body>

  <!-- SETUP PHASE (Shown until permission granted) -->
  <div id="setup-ui">
    <button id="perm-btn" onclick="requestOrientationPermission()">Enable System Sensors</button>
    <div id="spectator-instruction">
      "Please focus on your mental selection, then pass the device face down."
    </div>
  </div>

  <!-- THE REVEAL CARD (Rendered via JS, hidden until locked) -->
  <div class="card" id="card-reveal">
    <!-- Top Left Corner -->
    <div class="corner top-left">
      <div class="corner-rank" id="card-rank-tl">A</div>
      <div class="corner-suit" id="card-suit-tl">♠</div>
    </div>
    
    <!-- Large Center Pip -->
    <div class="card-pip-center" id="card-pip-center">♠</div>
    
    <!-- Bottom Right Corner (Reversed) -->
    <div class="corner bottom-right">
      <div class="corner-rank" id="card-rank-br">A</div>
      <div class="corner-suit" id="card-suit-br">♠</div>
    </div>
  </div>

  <button id="reset-btn" onclick="resetApp()">Reset for Next Spectator</button>

  <!-- Sensor Data Debug -->
  <div class="debug-info" id="debug">Gamma: 0 | Beta: 0</div>

  <script>
    // --- Configuration ---
    const TILT_THRESHOLD = 25; // Degrees required to trigger

    // --- State Management ---
    let isSensorsActive = false;
    let isLocked = false;
    let cardPool = []; // Will store 4 random cards

    // --- DOM Elements ---
    const setupUI = document.getElementById('setup-ui');
    const cardReveal = document.getElementById('card-reveal');
    const debugEl = document.getElementById('debug');
    const resetBtn = document.getElementById('reset-btn');

    // --- Initialization ---
    generateRandomCardPool(); // Create the 4 cards immediately on page load

    // 1. Generate 4 Random Distinct Playing Cards
    function generateRandomCardPool() {
      const suits = [
        { char: '♠', name: 'spades', color: 'black' },
        { char: '♥', name: 'hearts', color: 'red' },
        { char: '♦', name: 'diamonds', color: 'red' },
        { char: '♣', name: 'clubs', color: 'black' }
      ];
      // Note: 'T' is placeholder for 10
      const ranks = ['A', '2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K'];

      // Clear previous pool
      cardPool = [];
      let usedCards = new Set();

      while (cardPool.length < 4) {
        const randomSuit = suits[Math.floor(Math.random() * suits.length)];
        const randomRank = ranks[Math.floor(Math.random() * ranks.length)];
        const cardKey = `${randomRank}${randomSuit.char}`;

        if (!usedCards.has(cardKey)) {
          usedCards.add(cardKey);
          cardPool.push({
            rank: randomRank === 'T' ? '10' : randomRank,
            suit: randomSuit
          });
        }
      }
      console.log("Card Pool Generated:", cardPool);
    }

    // 2. iOS Permission Handling
    function requestOrientationPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              activateSensors();
            } else { alert('Permission denied by user.'); }
          })
          .catch(console.error);
      } else {
        // Non-iOS or older devices
        activateSensors();
      }
    }

    function activateSensors() {
      isSensorsActive = true;
      window.addEventListener('deviceorientation', handleOrientation);
      // Hide setup, show "waiting" state visually (hidden card)
      setupUI.style.display = 'none';
    }

    // 3. Sensor Handling & *Your Specific Mapping Logic*
    function handleOrientation(event) {
      if (!isSensorsActive || isLocked) return;

      const gamma = Math.round(event.gamma || 0); // L/R Roll [-90 to 90]
      const beta = Math.round(event.beta || 0);   // F/B Pitch [-180 to 180]

      debugEl.innerText = `Gamma (L/R): ${gamma}° | Beta (Top/Bottom): ${beta}°`;

      // Threshold check
      if (Math.abs(gamma) < TILT_THRESHOLD && Math.abs(beta) < TILT_THRESHOLD) return;

      // SPECIFIC USER-REQUESTED MAPPING LOGIC:
      // We prioritize Gamma (Side) over Beta (Top/Bottom) if both are tilted.

      if (gamma < -TILT_THRESHOLD) {
        // 1. "top-left should come when I tilt LEFT first" (Gamma negative)
        lockSelection(0); // Index 0 of the random pool
      } else if (beta > TILT_THRESHOLD) {
        // 2. "top-right should come when I tilt TOP first" (Beta positive/lifting up)
        lockSelection(1); // Index 1
      } else if (beta < -TILT_THRESHOLD) {
        // 3. "bottom-left should come when I tilt FROM BOTTOM first" (Beta negative/tilting forward)
        lockSelection(2); // Index 2
      } else if (gamma > TILT_THRESHOLD) {
        // 4. "bottom-right if I tilt FROM RIGHT?" (Gamma positive)
        lockSelection(3); // Index 3
      }
    }

    // 4. Locking the Display
    function lockSelection(cardIndex) {
      isLocked = true; // Arm the lock guard
      
      const selectedInvisibleCard = cardPool[cardIndex];
      renderCardFace(selectedInvisibleCard);

      cardReveal.style.display = 'block'; // Show the rendering
      debugEl.style.display = 'none'; // Hide debug
      resetBtn.style.display = 'block'; // Reveal reset option
    }

    // 5. Drawing the Bicycle Suit Layout via DOM
    function renderCardFace(cardData) {
      const { rank, suit } = cardData;

      // Handle suit color (Bicycle Red/Black)
      if (suit.color === 'red') {
        cardReveal.classList.add('red-suit');
      } else {
        cardReveal.classList.remove('red-suit');
      }

      // Populate UTF-8 characters and ranks
      document.getElementById('card-rank-tl').innerText = rank;
      document.getElementById('card-suit-tl').innerText = suit.char;
      document.getElementById('card-pip-center').innerText = suit.char;
      document.getElementById('card-rank-br').innerText = rank;
      document.getElementById('card-suit-br').innerText = suit.char;
    }

    // 6. Complete System Reset
    function resetApp() {
      // 1. Generate a *new* set of 4 random cards
      generateRandomCardPool();
      
      // 2. Reset visual state
      isLocked = false;
      cardReveal.style.display = 'none';
      setupUI.style.display = 'flex';
      resetBtn.style.display = 'none';
      debugEl.style.display = 'block';
    }
  </script>
</body>
</html>
